name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lintとテスト
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存パッケージをインストール
        run: npm ci

      - name: lintを実行
        run: npm run lint

      - name: テストを実行
        run: npm test

      # デプロイ時にしか実行されないビルド（LINK_TAG完全一致チェックを含む）の
      # 失敗をマージ前に検出する。成果物はコミットしない（検証のみ）
      - name: ビルドを検証
        run: npm run build
