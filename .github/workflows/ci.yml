name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lintとテスト
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存パッケージをインストール
        run: npm ci

      - name: lintを実行
        run: npm run lint

      - name: テストを実行
        run: npm test
