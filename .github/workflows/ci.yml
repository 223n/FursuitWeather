name: CI

# 外部アクションはタグではなくコミットSHAで固定する（タグは付け替えられるため、
# 乗っ取られたタグでジョブが動く事故を防ぐ）。併記の`# vN`はDependabotが追従する

on:
  push:
    branches: [main]
  pull_request:

# 最小権限: コードの読み取りのみ（公開リポジトリ化に備えた明示指定）
permissions:
  contents: read

jobs:
  test:
    name: lintとテスト
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node.jsをセットアップ
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: 依存パッケージをインストール
        run: npm ci

      - name: lintを実行
        run: npm run lint

      # カバレッジしきい値（vitest.config.ts）の未達もここで失敗になる
      - name: テストを実行（カバレッジしきい値つき）
        run: npm run test:coverage

      # デプロイ時にしか実行されないビルド（LINK_TAG完全一致チェックを含む）の
      # 失敗をマージ前に検出する。成果物はコミットしない（検証のみ）
      - name: ビルドを検証
        run: npm run build

  # フロントエンド（public/のブラウザJS）の実挙動をモックAPIで検証する。
  # 上流ネットワークへは接続しない（e2e/のテストがAPIをすべてモックする）
  e2e:
    name: E2Eテスト（Playwright）
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node.jsをセットアップ
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: 依存パッケージをインストール
        run: npm ci

      - name: Chromiumをインストール
        run: npx playwright install --with-deps chromium

      - name: E2Eテストを実行
        run: npm run test:e2e
