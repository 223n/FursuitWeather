name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小権限: コードの読み取りのみ（公開リポジトリ化に備えた明示指定）
permissions:
  contents: read

jobs:
  test:
    name: lintとテスト
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 依存パッケージをインストール
        run: npm ci

      - name: lintを実行
        run: npm run lint

      # カバレッジしきい値（vitest.config.ts）の未達もここで失敗になる
      - name: テストを実行（カバレッジしきい値つき）
        run: npm run test:coverage

      # デプロイ時にしか実行されないビルド（LINK_TAG完全一致チェックを含む）の
      # 失敗をマージ前に検出する。成果物はコミットしない（検証のみ）
      - name: ビルドを検証
        run: npm run build

  # フロントエンド（public/のブラウザJS）の実挙動をモックAPIで検証する。
  # 上流ネットワークへは接続しない（e2e/のテストがAPIをすべてモックする）
  e2e:
    name: E2Eテスト（Playwright）
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 依存パッケージをインストール
        run: npm ci

      - name: Chromiumをインストール
        run: npx playwright install --with-deps chromium

      - name: E2Eテストを実行
        run: npm run test:e2e
