name: Release

# GitHubリリースを自動作成する。起動方法は2つ:
# - バージョンタグ（v*）のpush（タグとpackage.jsonの不一致は失敗させる）
# - Actionsタブ等からの手動実行（package.jsonのバージョンでタグを作成してから
#   リリースを作成する。ローカルからタグをpushできない環境向け）
# リリースノートは前回リリース以降のマージ済みPRから自動生成される。
# 本番デプロイはmainへのマージ時（deploy.yml）に行われ、タグ・リリースは
# デプロイとは独立した「記録」の役割（手順はdocs/release.mdを参照）

# 外部アクションはタグではなくコミットSHAで固定する（タグは付け替えられるため、
# 乗っ取られたタグでジョブが動く事故を防ぐ）。併記の`# vN`はDependabotが追従する

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: GitHubリリースを作成
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # タグpush時: タグの付け間違い（package.jsonとの不一致）を検出する
      # 手動実行時: package.jsonのバージョンでタグを作成してpushする
      # （GITHUB_TOKENによるタグpushはワークフローを再帰起動しないため二重実行にならない）
      - name: バージョンを決定してタグを確認・作成
        id: version
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="v${pkg_version}"
            if ! git ls-remote --exit-code origin "refs/tags/${tag}" > /dev/null; then
              git tag "${tag}"
              git push origin "${tag}"
            fi
          else
            tag="${GITHUB_REF_NAME}"
            if [ "${tag#v}" != "${pkg_version}" ]; then
              echo "タグ ${tag} と package.json の ${pkg_version} が一致しません" >&2
              exit 1
            fi
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: GitHubリリースを作成（ノートは自動生成）
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.tag }}" --generate-notes --verify-tag
