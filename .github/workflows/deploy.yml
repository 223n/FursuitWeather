name: Deploy

# Cloudflare Workersへのデプロイ
# リポジトリのSecretsにCLOUDFLARE_API_TOKENとCLOUDFLARE_ACCOUNT_IDの設定が必要
# mainへのpushで自動デプロイし、Actionsタブからの手動実行にも対応する

# 外部アクションはタグではなくコミットSHAで固定する（タグは付け替えられるため、
# 乗っ取られたタグでジョブが動く事故を防ぐ）。併記の`# vN`はDependabotが追従する

on:
  workflow_dispatch:
  push:
    branches:
      - main

# 最小権限: コードの読み取りのみ。デプロイの認証はCloudflareのSecretsで行うため
# GITHUB_TOKENへの書き込み権限は不要（公開リポジトリ化に備えた明示指定）
permissions:
  contents: read

# 短時間に連続pushしたとき、所要時間の揺らぎで古いコミットのデプロイが
# 後から完走して本番を巻き戻さないよう、「最後のpushが勝つ」に揃える
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Cloudflare Workersへデプロイ
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node.jsをセットアップ
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: 依存パッケージをインストール
        run: npm ci

      - name: lintを実行
        run: npm run lint

      # CIと同一の関門: カバレッジしきい値（vitest.config.ts）の未達もここで失敗になる
      - name: テストを実行（カバレッジしきい値つき）
        run: npm run test:coverage

      - name: ビルド（minify+CSSインライン化）
        run: npm run build

      - name: デプロイ
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
