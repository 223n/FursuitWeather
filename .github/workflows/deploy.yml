name: Deploy

# Cloudflare Workersへのデプロイ
# リポジトリのSecretsにCLOUDFLARE_API_TOKENとCLOUDFLARE_ACCOUNT_IDの設定が必要
# mainへのpushで自動デプロイし、Actionsタブからの手動実行にも対応する

on:
  workflow_dispatch:
  push:
    branches:
      - main

# 短時間に連続pushしたとき、所要時間の揺らぎで古いコミットのデプロイが
# 後から完走して本番を巻き戻さないよう、「最後のpushが勝つ」に揃える
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Cloudflare Workersへデプロイ
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存パッケージをインストール
        run: npm ci

      - name: lintを実行
        run: npm run lint

      - name: テストを実行
        run: npm test

      - name: ビルド（minify+CSSインライン化）
        run: npm run build

      - name: デプロイ
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
