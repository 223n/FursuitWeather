# 依存パッケージとGitHub Actionsの更新PRを自動作成する
# マイナー・パッチ更新は1つのPRにまとめ、確認の手間を減らす
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    # ラベルは日本語へ寄せたため明示する。指定しないとDependabotが既定名
    # （dependencies・javascript）のラベルを英語で作り直してしまう。
    # アサインも付かないため明示する。すべてのPRをラベル+アサイン付きで揃える運用（CLAUDE.md）
    labels:
      - "依存関係"
      - "JavaScript"
    assignees:
      - "223n"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    groups:
      # vitest本体と@vitest/*はpeerがバージョン完全一致で固定されている。
      # 別々のPRに分かれるとpeerの解決に失敗し、必ずERESOLVEで落ちる
      # （PR #116・#117がこれ）。メジャーも含めて1つのPRにまとめる。
      # 先に書いた組が優先されるため、minor-and-patchより上に置く。
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # typescript 7系はtypescript-eslintが未対応（対応範囲>=4.8.4 <6.1.0、PR #66参照）
    # のためlintが起動できない。typescript-eslintの対応後にこのignoreを外して追従する
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - "依存関係"
      - "GitHub Actions"
    assignees:
      - "223n"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
