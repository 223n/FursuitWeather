# 依存パッケージとGitHub Actionsの更新PRを自動作成する
# マイナー・パッチ更新は1つのPRにまとめ、確認の手間を減らす
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # typescript 7系はtypescript-eslintが未対応（対応範囲>=4.8.4 <6.1.0、PR #66参照）
    # のためlintが起動できない。typescript-eslintの対応後にこのignoreを外して追従する
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
